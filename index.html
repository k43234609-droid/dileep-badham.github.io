<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dileep Kumar Badham — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"]{
    --bg: #0B1220;
    --bg-alt: #0F1830;
    --card: #121D36;
    --card-hover: #16223F;
    --border: #22304F;
    --text: #EAF0FB;
    --text-dim: #9AA9C7;
    --text-faint: #5E6D8C;
    --accent: #3FA9F5;
    --accent-2: #7C6CF0;
    --accent-dim: rgba(63,169,245,0.12);
    --shadow: rgba(0,0,0,0.35);
  }
  [data-theme="light"]{
    --bg: #F5F7FB;
    --bg-alt: #FFFFFF;
    --card: #FFFFFF;
    --card-hover: #F0F3FA;
    --border: #E1E6F0;
    --text: #101828;
    --text-dim: #4B5670;
    --text-faint: #8A93AC;
    --accent: #2A8FD6;
    --accent-2: #6355D8;
    --accent-dim: rgba(42,143,214,0.1);
    --shadow: rgba(30,40,70,0.10);
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }
  h1,h2,h3,h4{ font-family:'Poppins', sans-serif; margin:0; }
  a{ color: var(--accent); text-decoration:none; }
  button{ font-family: inherit; cursor:pointer; }

  .wrap{ max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  /* Navbar */
  header{
    position: sticky; top:0; z-index: 60;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner{
    max-width: 1040px; margin:0 auto; padding: 16px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{ font-family:'Poppins',sans-serif; font-weight:800; font-size:20px; color: var(--accent); }
  .nav-actions{ display:flex; align-items:center; gap:14px; }
  .icon-btn{
    background: var(--card); border:1px solid var(--border); color: var(--text);
    width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    transition: border-color .2s, transform .2s, background-color .2s;
  }
  .icon-btn:hover{ border-color: var(--accent); transform: translateY(-1px); }
  .icon-btn svg{ width:18px; height:18px; fill: currentColor; }

  .nav-links{
    display:flex; gap:26px; font-size:14.5px; font-weight:500;
    position:absolute; top:64px; right:24px; background: var(--card);
    border:1px solid var(--border); border-radius:12px; padding:14px 20px;
    flex-direction:column; box-shadow: 0 12px 32px var(--shadow);
    opacity:0; pointer-events:none; transform: translateY(-8px);
    transition: opacity .2s ease, transform .2s ease;
    z-index: 100;
  }
  .nav-links.open{ opacity:1; pointer-events:auto; transform:translateY(0); }
  .nav-links a{ color: var(--text-dim); }
  .nav-links a:hover{ color: var(--accent); }

  @media(min-width: 768px) {
    .nav-links {
      position: static; opacity: 1; pointer-events: auto; transform: none;
      flex-direction: row; background: none; border: none; padding: 0; box-shadow: none;
    }
    .menu-toggle { display: none; }
  }

  /* Hero */
  .hero{
    padding: 96px 0 80px; text-align:center; position:relative; overflow:hidden;
  }
  .hero::before{
    content:""; position:absolute; top:-140px; left:50%; transform:translateX(-50%);
    width:640px; height:420px; border-radius:50%;
    background: radial-gradient(circle, var(--accent-dim), transparent 70%);
    pointer-events:none;
  }
  .hero-eyebrow{
    display:inline-block; font-size:13px; font-weight:600; color: var(--accent);
    background: var(--accent-dim); padding:6px 14px; border-radius:999px; margin-bottom:22px;
    opacity:0; animation: fadeUp .6s ease forwards;
  }
  .hero h1{
    font-size: clamp(32px, 6vw, 52px); font-weight:800; line-height:1.15;
    margin-bottom:16px; opacity:0; animation: fadeUp .6s ease .1s forwards;
  }
  .hero h1 span{
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p{
    color: var(--text-dim); font-size:17px; max-width:560px; margin:0 auto 34px;
    opacity:0; animation: fadeUp .6s ease .2s forwards;
  }
  .hero-actions{
    display:flex; gap:14px; justify-content:center; flex-wrap:wrap;
    opacity:0; animation: fadeUp .6s ease .3s forwards;
  }
  .btn{
    font-size:15px; font-weight:600; padding:13px 28px; border-radius:10px;
    border:1px solid transparent; transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn-primary{
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); color:#fff;
  }
  .btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 10px 24px var(--accent-dim); }
  .btn-outline{ background: transparent; border-color: var(--border); color: var(--text); }
  .btn-outline:hover{ border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  /* Reveal on scroll */
  .reveal{ opacity:0; transform: translateY(20px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }

  section{ padding: 70px 0; }
  .section-head{ text-align:center; max-width:600px; margin:0 auto 44px; }
  .section-head h2{ font-size: clamp(24px,4vw,34px); font-weight:800; margin-bottom:12px; }
  .section-head h2 span{ color: var(--accent); }
  .section-head p{ color: var(--text-dim); font-size:15.5px; }

  /* Project cards */
  .projects-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:26px; }
  @media (max-width: 760px){ .projects-grid{ grid-template-columns:1fr; } }
  .project-card{
    background: var(--card); border:1px solid var(--border); border-radius:16px;
    overflow:hidden; transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .project-card:hover{
    transform: translateY(-6px); border-color: var(--accent);
    box-shadow: 0 20px 40px var(--shadow);
  }
  .project-visual{
    background: var(--bg-alt); padding:40px 18px; border-bottom:1px solid var(--border);
    display: flex; justify-content: center; align-items: center; color: var(--text-faint);
  }
  .project-visual svg{ width:64px; height:64px; display:block; fill: currentColor; }
  .project-body{ padding:22px 24px 26px; }
  .project-body h3{ font-size:19px; font-weight:700; margin-bottom:8px; }
  .project-body p{ color: var(--text-dim); font-size:14.5px; margin-bottom:16px; }
  .tech-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .tech-chip{
    font-size:12.5px; font-weight:600; color: var(--accent);
    background: var(--accent-dim); padding:5px 12px; border-radius:999px;
  }
  .project-links{ display:flex; align-items:center; gap:20px; }
  .details-link{
    font-weight:600; font-size:14.5px; color: var(--accent);
    display:inline-flex; align-items:center; gap:6px; background:none; border:none; padding:0;
  }
  .details-link svg{ width:15px; height:15px; transition: transform .2s ease; fill: currentColor; }
  .details-link:hover svg{ transform: translateX(4px); }

  /* Skills */
  .skills-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:20px; }
  @media (max-width:760px){ .skills-grid{ grid-template-columns:1fr; } }
  .skill-card{
    background: var(--card); border:1px solid var(--border); border-radius:14px; padding:24px;
    transition: transform .2s ease, border-color .2s ease;
  }
  .skill-card:hover{ transform: translateY(-4px); border-color: var(--accent); }
  .skill-card h4{ font-size:15px; font-weight:700; margin-bottom:14px; color: var(--accent); }
  .skill-tags{ display:flex; flex-wrap:wrap; gap:8px; }
  .skill-tag{
    font-size:13px; background: var(--bg-alt); border:1px solid var(--border);
    padding:5px 12px; border-radius:8px; color: var(--text-dim);
  }

  /* Experience timeline */
  .timeline{ max-width:680px; margin:0 auto; }
  .tl-item{
    display:grid; grid-template-columns: 20px 1fr; gap:18px; padding-bottom:34px; position:relative;
  }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-dot-col{ display:flex; flex-direction:column; align-items:center; }
  .tl-dot{ width:12px; height:12px; background: var(--accent); border-radius:50%; margin-top:6px; z-index:2; }
  .tl-line{ width:2px; flex-grow:1; background: var(--border); margin-top:4px; z-index:1; }
  .tl-item:last-child .tl-line { display: none; }
  
  .tl-content{ background: var(--card); border:1px solid var(--border); padding:20px 24px; border-radius:12px; }
  .tl-header{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
  .tl-role{ font-size:17px; font-weight:700; margin:0; }
  .tl-company{ font-size:14.5px; color: var(--accent); font-weight:500; }
  .tl-date{ font-size:13px; color: var(--text-faint); font-weight:500; }
  .tl-desc{ font-size:14.5px; color: var(--text-dim); margin:0; }

  /* Footer */
  footer { border-top: 1px solid var(--border); padding: 40px 0; text-align: center; color: var(--text-faint); font-size: 14px; }
</style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <div class="nav-inner">
      <div class="brand">DKB</div>
      <div class="nav-actions">
        <nav class="nav-links" id="navLinks">
          <a href="#projects">Projects</a>
          <a href="#skills">Skills</a>
          <a href="#experience">Experience</a>
        </nav>
        <!-- Theme Toggle Button -->
